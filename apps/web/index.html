<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Sets <html data-theme> before anything is drawn, so a refresh never flashes the wrong
      // theme. Must match THEME_STORAGE_KEY and resolveTheme in src/context/theme.js.
      ;(function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('fastfix-theme') || 'system'
        } catch (error) {
          // Storage blocked (private mode, settings): follow the system
        }
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
    />
    <title>MOTEXA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
